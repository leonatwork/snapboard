name: Release Snapboard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-macos-release:
    name: Build macOS Release (.zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Without the secrets the build falls back to ad-hoc signing, as before.
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 is not set, building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=leonatwork Code Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS App Bundle
        run: |
          ./scripts/build_app.sh

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --strict "build/Snapboard.app"
          # A stable identity shows up as "certificate leaf" in the designated requirement.
          codesign -d -r- "build/Snapboard.app" 2>&1 | grep "certificate leaf"

      - name: Package macOS App into Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Snapboard.app Snapboard-macOS.zip
          mv Snapboard-macOS.zip ../Snapboard-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapboard-macOS
          path: Snapboard-macOS.zip

  build-windows-release:
    name: Build Windows Release (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Standalone Executable
        run: |
          dotnet publish windows/Snapboard.Windows/Snapboard.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release-win-x64

      - name: Package Windows Executable into Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release-win-x64\* -DestinationPath Snapboard-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapboard-Windows-x64
          path: Snapboard-Windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-release, build-windows-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Snapboard-macOS
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Snapboard-Windows-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/Snapboard-macOS.zip
            release-assets/Snapboard-Windows-x64.zip
          title: "Snapboard Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
