name: Build Snapboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    name: Build macOS (Swift)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS App
        run: |
          ./scripts/build_app.sh
      - name: Run editor regression tests
        run: swift test --filter 'AnnotationPreviewTests|AnnotationRenderingRegressionTests|EditorExportTests'
      - name: Verify text preview (existing harness)
        run: ./scripts/screenshots/render.sh --verify-text
      - name: Verify annotations and unchanged exports
        run: ./scripts/screenshots/render.sh --verify-annotations

  build-windows:
    name: Build Windows (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows App
        run: |
          dotnet build windows/Snapboard.Windows/Snapboard.Windows.csproj -c Release
      - name: Run Windows regression tests
        run: dotnet run --project windows/Tests/Snapboard.Windows.Tests.csproj -c Release
